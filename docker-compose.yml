# Kabanchik local stack. Canonical dev path (GCP deploy lifts-and-shifts this).
#   docker compose up --build   →  backend :8000, frontend :3000
#
# Docker daemon: Colima — Docker Desktop is NOT required. One-time setup:
#   brew install colima docker docker-compose docker-buildx
#   colima start --cpu 6 --memory 8 --disk 60 --vm-type vz --mount-type virtiofs
# The docker/compose CLIs talk to Colima via the `colima` docker context.
# Full notes: wiki/domains/deployment.md → "Local Docker daemon (Colima)".
#
# State lives on the host under ./data so it survives container rebuilds:
#   data/db   — SQLite
#   data/rag  — RAG-Anything store
#   data/keys — Google service-account JSON (when slice 3 lands)

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data/db:/app/data/db
      - ./data/rag:/app/data/rag
      - ./data/keys:/app/data/keys
    restart: unless-stopped

  # Dev-mode Next.js. A production multi-stage frontend image is a follow-up
  # (see beads) — bootstrap only needs the dev server wired on :3000.
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
      # Read the dedicated NEXT_PUBLIC_APP_ENVIRONMENT from .env (default
      # production). Previously this read ${APP_ENVIRONMENT}, so the
      # NEXT_PUBLIC_APP_ENVIRONMENT knob documented in .env.example was a silent
      # no-op under Compose — review #14. Keep it equal to APP_ENVIRONMENT (the
      # .env.example template ships both set to the same value).
      - NEXT_PUBLIC_APP_ENVIRONMENT=${NEXT_PUBLIC_APP_ENVIRONMENT:-production}
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
