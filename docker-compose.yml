# Kabanchik local stack — canonical local dev path.
#   docker compose up --build   →  backend :8000, frontend :3000, LightRAG :9621
#
# NOT a verbatim GCP lift-and-shift: on GCP the `postgres` service below is
# dropped and LIGHTRAG_POSTGRES_* point at Cloud SQL via a deploy-time override
# (ScrumAgent-ebp). Running this file unchanged on GCP would start a redundant
# Postgres next to Cloud SQL.
#
# Docker daemon: Docker Desktop on macOS. Full notes:
#   wiki/domains/deployment.md → "Local Docker daemon".
#
# State lives on the host under ./data so it survives container rebuilds:
#   data/db   — SQLite
#   data/rag  — legacy on-disk RAG store
#   data/lightrag — LightRAG runtime inputs/prompts/working dir
#   data/postgres — local PostgreSQL for LightRAG storage parity
#   data/keys — Google service-account JSON (when slice 3 lands)

services:
  postgres:
    image: gzdaniel/postgres-for-rag:pg18-age-pgvector
    platform: linux/amd64
    environment:
      POSTGRES_USER: ${LIGHTRAG_POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${LIGHTRAG_POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${LIGHTRAG_POSTGRES_DATABASE:-lightrag}
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  lightrag:
    image: ghcr.io/hkuds/lightrag:v1.5.3
    ports:
      - "127.0.0.1:9621:9621"
    volumes:
      - ./data/lightrag/rag_storage:/app/data/rag_storage
      - ./data/lightrag/inputs:/app/data/inputs
      - ./data/lightrag/prompts:/app/data/prompts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOST: 0.0.0.0
      PORT: 9621
      WORKING_DIR: /app/data/rag_storage
      INPUT_DIR: /app/data/inputs
      PROMPT_DIR: /app/data/prompts
      WORKSPACE: ${LIGHTRAG_WORKSPACE:-scrumagent}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LIGHTRAG_API_KEY: ${LIGHTRAG_API_KEY:-}
      WHITELIST_PATHS: /health
      LLM_BINDING: openai
      LLM_BINDING_HOST: https://api.openai.com/v1
      LLM_BINDING_API_KEY: ${OPENAI_API_KEY}
      LLM_MODEL: ${LIGHTRAG_LLM_MODEL:-gpt-5.4-mini}
      EMBEDDING_BINDING: openai
      EMBEDDING_BINDING_HOST: https://api.openai.com/v1
      EMBEDDING_BINDING_API_KEY: ${OPENAI_API_KEY}
      EMBEDDING_MODEL: ${LIGHTRAG_EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIM: ${LIGHTRAG_EMBEDDING_DIM:-1536}
      LIGHTRAG_KV_STORAGE: PGKVStorage
      LIGHTRAG_DOC_STATUS_STORAGE: PGDocStatusStorage
      LIGHTRAG_GRAPH_STORAGE: PGGraphStorage
      LIGHTRAG_VECTOR_STORAGE: PGVectorStorage
      POSTGRES_HOST: ${LIGHTRAG_POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${LIGHTRAG_POSTGRES_PORT:-5432}
      POSTGRES_USER: ${LIGHTRAG_POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${LIGHTRAG_POSTGRES_PASSWORD:-rag}
      POSTGRES_DATABASE: ${LIGHTRAG_POSTGRES_DATABASE:-lightrag}
      POSTGRES_MAX_CONNECTIONS: ${LIGHTRAG_POSTGRES_MAX_CONNECTIONS:-25}
      POSTGRES_VECTOR_INDEX_TYPE: ${LIGHTRAG_POSTGRES_VECTOR_INDEX_TYPE:-HNSW}
      POSTGRES_SSL_MODE: ${LIGHTRAG_POSTGRES_SSL_MODE:-disable}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9621/health', timeout=5).read()\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data/db:/app/data/db
      - ./data/rag:/app/data/rag
      - ./data/keys:/app/data/keys
    depends_on:
      # Ordering only — start after lightrag, but don't gate the backend (auth,
      # projects, chat) on RAG health: RAG isn't wired into the backend yet
      # (ScrumAgent-o39). Revisit graceful readiness gating when app/rag.py lands.
      lightrag:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # Dev-mode Next.js. A production multi-stage frontend image is a follow-up
  # (see beads) — bootstrap only needs the dev server wired on :3000.
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
      # Read the dedicated NEXT_PUBLIC_APP_ENVIRONMENT from .env (default
      # production). Previously this read ${APP_ENVIRONMENT}, so the
      # NEXT_PUBLIC_APP_ENVIRONMENT knob documented in .env.example was a silent
      # no-op under Compose — review #14. Keep it equal to APP_ENVIRONMENT (the
      # .env.example template ships both set to the same value).
      - NEXT_PUBLIC_APP_ENVIRONMENT=${NEXT_PUBLIC_APP_ENVIRONMENT:-production}
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      # Ordering only — `npm install` is independent of the backend, so don't
      # serialize it behind backend health; the dev server proxies at runtime
      # (browser-side), by when the backend is up.
      backend:
        condition: service_started
    restart: unless-stopped
